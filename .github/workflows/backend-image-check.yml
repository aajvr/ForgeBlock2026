# On pull requests that touch the backend: build the Docker image the Hugging Face
# Space will build, start it, and check /api/health. Nothing is pushed anywhere.
name: Backend image check
on:
  pull_request:
    paths: ["forgeblock/backend/**", ".github/workflows/*.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t forgeblock-api forgeblock/backend
      - name: Start it and check /api/health
        run: |
          docker run -d --name api -p 7860:7860 -e JWT_SECRET=ci forgeblock-api
          for i in $(seq 1 60); do curl -fsS localhost:7860/api/health && exit 0; sleep 5; done
          docker logs api; exit 1
