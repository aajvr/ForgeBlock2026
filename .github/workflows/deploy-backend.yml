# Builds the backend image on every push to main and publishes it to GitHub
# Container Registry (ghcr.io/<owner>/forgeblock-api:latest). If the repository
# secret AZURE_WEBHOOK_URL is set (Azure Web App > Deployment Center > Webhook URL),
# Azure is then told to pull the new image and restart.
name: Deploy backend
on:
  push:
    branches: [main]
    paths: ["forgeblock/backend/**", ".github/workflows/deploy-backend.yml"]
  pull_request:
    paths: ["forgeblock/backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/forgeblock-api" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: forgeblock/backend
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test (pull requests only)
        if: github.event_name == 'pull_request'
        run: |
          docker run -d --name api -p 7860:7860 -e JWT_SECRET=ci "${IMAGE}:latest"
          for i in $(seq 1 60); do curl -fsS localhost:7860/api/health && exit 0; sleep 5; done
          docker logs api; exit 1
      - name: Tell Azure to pull the new image
        if: github.event_name != 'pull_request'
        env:
          HOOK: ${{ secrets.AZURE_WEBHOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then echo "AZURE_WEBHOOK_URL not set yet; image published only."; exit 0; fi
          curl -fsS -X POST "$HOOK" -d '' && echo "Azure notified."
